name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  native-gates:
    # The WIT, adapter-registry and guest-lint gates are Kotoba programs
    # (scripts/native/) run by the pinned Amu macOS CLI (JUN-642). Python only
    # stages the repository files into each program and reads main's result.
    # No kbb, nbb, JVM or Node runs here; the CLJK gates in scripts/ are the
    # hand-run reference oracle.
    name: Native contract gates (Amu, macOS arm64)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kotoba-lang/amu
          ref: f7c07dff86d7fb5e89219a0f9ad4a83b2a83c82e
          path: _native/amu
          persist-credentials: false
          sparse-checkout: |
            bin
            seed/bootstrap/aarch64-macos
          sparse-checkout-cone-mode: false
      - name: Verify the pinned Amu images
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('_native/amu')
          meta = json.loads((root / 'seed/bootstrap/aarch64-macos/cli.json').read_text())
          for part in ('image', 'compiler'):
              data = (root / meta[part]['path']).read_bytes()
              assert hashlib.sha256(data).hexdigest() == meta[part]['sha256'], part
          assert (root / 'bin/amu').resolve() == (root / meta['image']['path']).resolve()
          PY
      - name: WIT, adapter registry and guest lint, with negative controls
        run: |
          sha=$(python3 -c 'import json; print(json.load(open("_native/amu/seed/bootstrap/aarch64-macos/cli.json"))["image"]["sha256"])')
          python3 scripts/native_gates.py --amu _native/amu/bin/amu --amu-sha256 "$sha" --output "$RUNNER_TEMP/native-gates"
  no-rust:
    name: No Rust runtime files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: ensure Rust runtime files stay out
        run: |
          if find . \
            \( -name Cargo.toml -o -name Cargo.lock -o -name '*.rs' -o -name 'rust-toolchain*' -o -path './.cargo/*' \) \
            -print -quit | grep -q .; then
            find . \( -name Cargo.toml -o -name Cargo.lock -o -name '*.rs' -o -name 'rust-toolchain*' -o -path './.cargo/*' \) -print
            exit 1
          fi
