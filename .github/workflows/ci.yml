name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  parity:
    name: WIT single-source + guest lint + no-rust guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # kbb resolves the kotoba.lang.* stdlib these gates require (from
      # nbb.edn); plain babashka has no kotoba.lang.edn and no bb.edn here.
      - uses: kotoba-lang/setup-kbb@9df85c3572851df091ba0f42d31acccb8acd84f1
      - name: WIT interface — EDN IDL == world.wit, every host fn documented
        run: kbb -M scripts/wit_test.cljk
      - name: adapter registry
        run: kbb -M scripts/check_adapter_registry.cljk
      - name: kami-clj games stay inside the guest vocabulary
        run: kbb -M scripts/guest_lint.cljk
      - name: ensure Rust runtime files stay out
        run: |
          if find . \
            \( -name Cargo.toml -o -name Cargo.lock -o -name '*.rs' -o -name 'rust-toolchain*' -o -path './.cargo/*' \) \
            -print -quit | grep -q .; then
            find . \( -name Cargo.toml -o -name Cargo.lock -o -name '*.rs' -o -name 'rust-toolchain*' -o -path './.cargo/*' \) -print
            exit 1
          fi
